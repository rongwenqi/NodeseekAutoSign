name: NodeSeek 每日保底签到
on:
  schedule:
    # UTC 00:25 = 北京时间 08:25 入队，你后续可以自行修改
    - cron: '25 0 * * *'
  workflow_dispatch: # 手动触发，不延迟

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests "curl_cffi>=0.6.2"

      - name: 随机延迟（仅定时任务）
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 10801 ))
          echo "随机延迟 ${DELAY} 秒，约 $(( DELAY / 60 )) 分钟"
          sleep $DELAY

      - name: 执行 NodeSeek 保底签到
        env:
          NODESEEK_COOKIE: ${{ secrets.NODESEEK_COOKIE }}
          NODESEEK_ACCOUNTS: ${{ secrets.NODESEEK_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python nodeseek_checkin.py
